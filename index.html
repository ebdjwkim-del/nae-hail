<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123c73"><title>내 할일 | 프로젝트 관리</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><link rel="apple-touch-icon" href="icons/icon.svg">
<style>
:root{--navy:#123c73;--blue:#1677ee;--pale:#eef5ff;--ink:#172b4d;--muted:#6b7b93;--line:#dce6f3;--bg:#f5f8fc;--green:#19a974}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font-weight:700}button.secondary{background:#eaf1fb;color:var(--navy)}button.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}button.danger{background:#fff0f0;color:#b42318}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)}textarea{min-height:95px;resize:vertical}label{display:block;font-size:13px;font-weight:700;color:#52647d;margin:12px 0 6px}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.app{min-height:100vh}.topbar{background:var(--navy);color:white;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(140deg,#2b91ff,#5c42d8);display:grid;place-items:center;font-size:25px;box-shadow:0 5px 15px #001d4730}.shell{display:grid;grid-template-columns:225px 1fr;max-width:1500px;margin:auto;min-height:calc(100vh - 70px)}.sidebar{background:white;border-right:1px solid var(--line);padding:18px 12px}.navbtn{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;color:#53657e}.navbtn.active,.navbtn:hover{background:var(--pale);color:var(--blue)}main{padding:24px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.pagehead h1{font-size:25px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 4px 15px #17345c08}.project{cursor:pointer;transition:.15s}.project:hover{transform:translateY(-2px);box-shadow:0 8px 22px #17345c12}.project h3{margin:10px 0 6px}.project .cover{height:85px;border-radius:11px;background:linear-gradient(120deg,#d8eaff,#edf4ff);display:grid;place-items:center;font-size:30px;color:var(--blue)}.bar{height:8px;background:#e6edf6;border-radius:20px;overflow:hidden;margin:9px 0}.bar span{display:block;height:100%;background:linear-gradient(90deg,#1681ff,#16b8a0);border-radius:20px}.row{display:flex;gap:10px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{display:inline-block;background:#edf5ff;color:#1769c2;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:700}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.formgrid .full{grid-column:1/-1}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}.tab{white-space:nowrap;background:transparent;color:var(--muted);border-radius:8px 8px 0 0}.tab.active{color:var(--blue);border-bottom:3px solid var(--blue)}.people{display:flex;flex-wrap:wrap;gap:8px}.person{background:#f2f6fc;padding:8px 10px;border-radius:9px;font-size:13px}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#d8e9ff,transparent 45%),var(--bg)}.loginbox{width:min(430px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 18px 60px #183c6b15}.loginbrand{text-align:center;margin-bottom:20px}.loginbrand .logo{margin:0 auto 10px;width:66px;height:66px;font-size:35px}.loginbrand h1{margin:0;font-size:29px}.loginbox button.primary{width:100%;margin-top:15px}.passwordrow{display:flex;gap:6px}.passwordrow input{flex:1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{padding:15px;background:white;border:1px solid var(--line);border-radius:13px}.stat strong{display:block;font-size:25px;color:var(--blue)}.sliderrow{display:flex;align-items:center;gap:12px}.sliderrow input[type=range]{padding:0;accent-color:var(--blue);cursor:ew-resize}.slider-value{min-width:54px;text-align:center;font-weight:900;color:var(--blue);font-size:20px}.logcard{margin:10px 0}.logdetails{white-space:pre-wrap;background:#f7faff;border-radius:10px;padding:12px;margin-top:10px}.filepreview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.filepreview img{width:95px;height:75px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.notice{background:#fff8e6;border:1px solid #f1d99a;border-radius:12px;padding:12px;font-size:13px;color:#76561a;margin-bottom:16px}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.footer{color:var(--muted);font-size:12px;margin-top:24px}.modalback{position:fixed;inset:0;background:#10233f77;display:grid;place-items:center;padding:15px;z-index:20}.modal{background:white;border-radius:18px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}.modal h2{margin-top:0}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.navbtn{width:auto;white-space:nowrap;margin:0}.sidebar .adminnav{margin-left:auto}}
@media(max-width:600px){.topbar{padding:11px 14px}.brand{font-size:19px}.shell{display:block}main{padding:15px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}.pagehead h1{font-size:22px}.topbar .muted{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const KEY='naeHailDemoV1';
let state={users:[],user:null,projects:[],page:'projects',selected:null,tab:'overview',admin:false};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');state={...state,...saved,user:null,admin:false}}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify({...state,user:null,admin:false}));
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=p=>Math.max(0,Math.min(100,Number(p.progress)||0));
function current(){return state.projects.find(p=>p.id===state.selected)}
function render(){if(!state.user){renderLogin();return}renderApp()}
function renderLogin(){ $('#root').innerHTML=`<div class="loginwrap"><section class="loginbox"><div class="loginbrand"><div class="logo">✓</div><h1>내 할일</h1><div class="muted">당신의 모든 프로젝트를 체계적으로</div></div><div class="tabs"><button class="tab active" id="loginTab">로그인</button><button class="tab" id="signupTab">회원가입</button></div><form id="authForm"><label>이메일</label><input type="email" id="email" required placeholder="you@example.com"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="rememberId" style="width:auto"> 아이디(이메일) 기억하기</label><label>비밀번호</label><div class="passwordrow"><input type="password" id="password" required placeholder="영문+숫자 포함 8자 이상"><button type="button" class="secondary" id="eye">보기</button></div><div class="muted" style="margin-top:6px">비밀번호는 영문과 숫자를 포함해 8자 이상이어야 합니다.</div><div id="authError" class="muted" style="color:#b42318;margin-top:8px"></div><button class="primary" type="submit" id="authSubmit">로그인</button></form><div class="footer">프로토타입 · 현재 데이터는 이 브라우저에 저장됩니다.</div></section></div>`;
const remembered=localStorage.getItem('naeHailRememberId')||'';if(remembered){$('#email').value=remembered;$('#rememberId').checked=true}let mode='login';const setMode=m=>{mode=m;$('#loginTab').classList.toggle('active',m==='login');$('#signupTab').classList.toggle('active',m==='signup');$('#authSubmit').textContent=m==='login'?'로그인':'회원가입';$('#authError').textContent=''};
$('#loginTab').onclick=()=>setMode('login');$('#signupTab').onclick=()=>setMode('signup');$('#eye').onclick=()=>{$('#password').type=$('#password').type==='password'?'text':'password';$('#eye').textContent=$('#password').type==='password'?'보기':'숨기기'};
$('#authForm').onsubmit=e=>{e.preventDefault();const email=$('#email').value.trim().toLowerCase(),pw=$('#password').value; if($('#rememberId').checked)localStorage.setItem('naeHailRememberId',email);else localStorage.removeItem('naeHailRememberId'); if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(pw)){$('#authError').textContent='영문과 숫자를 포함한 8자 이상 비밀번호를 입력하세요.';return}
if(mode==='signup'){if(state.users.some(u=>u.email===email)){$('#authError').textContent='이미 가입된 이메일입니다.';return}state.users.push({email,pw});save()}
else if(!state.users.some(u=>u.email===email&&u.pw===pw)){if(state.users.length===0){state.users.push({email,pw});}else{$('#authError').textContent='이메일 또는 비밀번호를 확인하세요. 새 데모에서는 먼저 회원가입하세요.';return}}
state.user={email};save();render()};
}
function renderApp(){const p=current();let nav=[['projects','📁 프로젝트 목록'],['concept','🧭 개념 및 관련 인물'],['progress','📈 진행 사항'],['results','🏁 결과 및 정리']];if(state.admin)nav.push(['admin','🛡 관리자 페이지']);
$('#root').innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="logo">✓</div>내 할일 <span class="muted" style="color:#d2e5ff;font-size:12px">PROJECT MANAGER</span></div><div class="row"><span class="muted" style="color:#d2e5ff">${esc(state.user.email)}</span><button class="secondary" id="adminToggle">${state.admin?'일반 화면':'관리자'}</button><button class="ghost" id="logout">로그아웃</button></div></header><div class="shell"><aside class="sidebar">${nav.map(n=>`<button class="navbtn ${state.page===n[0]?'active':''}" data-page="${n[0]}">${n[1]}</button>`).join('')}</aside><main id="main">${pageContent(p)}</main></div></div>`;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.tab='overview';render()});$('#logout').onclick=()=>{state.user=null;state.admin=false;render()};$('#adminToggle').onclick=()=>{state.admin=!state.admin;if(state.admin)state.page='admin';else state.page='projects';render()};
wirePage();}
function pageContent(p){if(state.page==='projects')return projectsPage();if(state.page==='concept')return detailPage(p,'concept');if(state.page==='progress')return detailPage(p,'progress');if(state.page==='results')return detailPage(p,'results');if(state.page==='admin'&&state.admin)return adminPage();return projectsPage()}
function projectsPage(){let active=state.projects.filter(p=>p.status!=='완료').length,done=state.projects.filter(p=>p.status==='완료').length;return `<div class="pagehead"><div><h1>프로젝트 목록</h1><div class="muted">프로젝트별 폴더와 진행률을 한눈에 관리하세요.</div></div><button id="newProject" ${state.projects.length>=20?'disabled':''}>＋ 새 프로젝트</button></div><div class="stats"><div class="stat"><span class="muted">전체 프로젝트</span><strong>${state.projects.length}/20</strong></div><div class="stat"><span class="muted">진행 중</span><strong>${active}</strong></div><div class="stat"><span class="muted">완료</span><strong>${done}</strong></div><div class="stat"><span class="muted">보관</span><strong>${state.projects.filter(p=>p.status==='보관').length}</strong></div></div><div class="notice">현재 버전은 기기 내 저장 방식의 프로토타입입니다. PC와 Android 간 실제 실시간 동기화는 서버/API 연결 후 활성화됩니다.</div><div class="grid">${state.projects.map(p=>`<article class="card project" data-open="${p.id}"><div class="between"><span class="pill">${esc(p.status||'진행 중')}</span><span class="muted">${pct(p)}%</span></div><div class="cover">${esc(p.icon||'📁')}</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.start||'시작일 미정')} ${p.end?'— '+esc(p.end):''}</div><div class="bar"><span style="width:${pct(p)}%"></span></div><div class="between"><span class="muted">${esc(p.owner||'담당자 미지정')}</span><button class="secondary" data-open="${p.id}">열기</button></div></article>`).join('')||'<div class="card empty">아직 프로젝트가 없습니다.<br>새 프로젝트를 만들어 시작하세요.</div>'}</div><div class="footer">프로젝트는 최대 20개까지 생성할 수 있습니다.</div>`}
function detailPage(p,which){if(!p)return `<div class="empty card"><h2>프로젝트를 선택하세요</h2><p>프로젝트 목록에서 폴더를 열면 세부 내용을 편집할 수 있습니다.</p><button id="backProjects">프로젝트 목록으로</button></div>`;
const head=`<div class="pagehead"><div><button class="ghost" id="backProjects">← 프로젝트 목록</button><h1 style="margin-top:12px">${esc(p.name)}</h1><div class="muted">프로젝트 진행률 ${pct(p)}%</div></div><button id="saveProject">저장</button></div><div class="tabs"><button class="tab ${which==='concept'?'active':''}" data-tab="concept">개념 및 관련 인물</button><button class="tab ${which==='progress'?'active':''}" data-tab="progress">진행 사항</button><button class="tab ${which==='results'?'active':''}" data-tab="results">결과 및 정리</button></div>`;
if(which==='concept')return `${head}<section class="card"><h3>프로젝트 개념</h3><div class="notice">프로젝트 ID: <b>${esc(p.id)}</b> · 이 번호로 프로젝트를 구분합니다.</div><label>프로젝트명</label><input id="p_name" value="${esc(p.name)}"><label>개념 및 목표</label><textarea id="p_concept" placeholder="프로젝트의 목적, 배경, 목표를 기록하세요.">${esc(p.concept)}</textarea><label>관련 인물 (이름 / 역할 / 연락처)</label><textarea id="p_people" placeholder="예: 김민수 / 프로젝트 책임자 / 010-0000-0000">${esc(p.people)}</textarea><label>담당자</label><input id="p_owner" value="${esc(p.owner)}" placeholder="담당자 이름"></section>`;
if(which==='progress')return `${head}<section class="card"><h3>날짜별 진행 기록 추가</h3><div class="formgrid"><div><label>기록 날짜</label><input type="date" id="log_date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>이 기록 시점의 진행률 — 드래그 (%)</label><div class="sliderrow"><input type="range" id="log_progress" min="0" max="100" step="1" value="${pct(p)}"><span class="slider-value" id="logProgressValue">${pct(p)}%</span></div></div><div class="full"><label>해당 날짜의 진행 내용</label><textarea id="log_text" placeholder="이 날짜에 진행한 작업, 결과, 문제점 등을 입력하세요."></textarea></div><div class="full"><label>파일 첨부 및 저장</label><div class="row" style="align-items:center;flex-wrap:wrap"><input type="file" id="log_files" multiple style="flex:1;min-width:210px"><button id="addProgressLog">저장</button></div><div class="muted">문서, PDF, 사진 등 파일을 선택한 뒤 저장을 누르세요. 파일 1개당 최대 3MB입니다.</div></div></div><div class="between" style="margin-top:20px"><h3>날짜별 진행 기록 보기</h3><select id="log_filter" style="max-width:220px"><option value="all">전체 진행률</option><option value="0-25">0~25%</option><option value="26-50">26~50%</option><option value="51-75">51~75%</option><option value="76-99">76~99%</option><option value="100">100% 완료</option></select></div><div id="progressLogs">${renderLogs(p,'all')}</div></section>`;
return `${head}<section class="card"><h3>결과 및 내용 정리</h3><label>결과물 정리</label><textarea id="p_output" placeholder="완성된 결과물, 문서, 납품물 등을 정리하세요.">${esc(p.output)}</textarea><label>성과 내용</label><textarea id="p_achievement" placeholder="목표 달성 정도와 핵심 성과를 기록하세요.">${esc(p.achievement)}</textarea><div class="formgrid"><div><label>마무리 날짜</label><input type="date" id="p_end" value="${esc(p.end)}"></div><div><label>프로젝트 결과</label><select id="p_outcome"><option value="">선택하세요</option><option ${p.outcome==='성공'?'selected':''}>성공</option><option ${p.outcome==='실패'?'selected':''}>실패</option></select></div></div><label>회고 및 후속 조치</label><textarea id="p_review" placeholder="배운 점, 남은 과제, 후속 일정">${esc(p.review)}</textarea></section>`}
function renderLogs(p,filter){const logs=(p.logs||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));const chosen=logs.filter(l=>{if(filter==='all')return true;if(filter==='100')return Number(l.progress)===100;const [a,b]=filter.split('-').map(Number);return Number(l.progress)>=a&&Number(l.progress)<=b});return chosen.length?chosen.map((l,i)=>`<article class="card logcard"><div class="between"><div><b>📅 ${esc(l.date)}</b><div class="muted">기록 ${logs.length-i}</div></div><span class="pill">진행률 ${Number(l.progress)||0}%</span></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(l.progress)||0))}%"></span></div><div class="row" style="flex-wrap:wrap;margin-top:10px"><button class="secondary" data-viewlog="${esc(l.id||l.date+'-'+i)}">날짜별 내용 보기 / 숨기기</button><button class="danger" data-deletelog="${esc(l.id||l.date+'-'+i)}">삭제</button></div><div class="logdetails hidden" data-logdetail="${esc(l.id||l.date+'-'+i)}">${esc(l.text||'내용 없음')}${(l.files||[]).length?'<div style="margin-top:12px"><b>첨부 파일</b>'+l.files.map(f=>`<div style="margin-top:6px">📎 <a href="${f.data}" download="${esc(f.name)}">${esc(f.name)}</a></div>`).join('')+'</div>':''}</div></article>`).join(''):'<div class="empty">아직 저장된 날짜별 진행 기록이 없습니다.</div>'}
function adminPage(){return `<div class="pagehead"><div><h1>관리자 페이지</h1><div class="muted">보안 설정과 화면 정의를 관리합니다.</div></div><span class="pill">데모 관리자 모드</span></div><div class="notice">주의: 이 프로토타입의 관리자 모드는 실제 권한 인증이 아닙니다. 공개 운영 전 서버 측 관리자 권한, 암호화, 감사 로그를 구현해야 합니다.</div><div class="grid"><section class="card"><h3>보안 관리</h3><label><input type="checkbox" id="setting_password" style="width:auto" checked> 영문+숫자 8자 이상 비밀번호 정책</label><label><input type="checkbox" id="setting_backup" style="width:auto" checked> 정기 백업 정책 사용</label><label><input type="checkbox" id="setting_log" style="width:auto" checked> 관리자 작업 로그 기록</label><button id="saveSecurity">보안 설정 저장</button></section><section class="card"><h3>프로젝트 현황</h3><p>전체 프로젝트: <b>${state.projects.length}</b> / 20</p><p>등록 계정(현재 브라우저): <b>${state.users.length}</b></p><button class="secondary" id="exportData">① PC에 백업 파일 다운로드</button><button class="secondary" id="myboxBackup" style="margin-top:8px">② 네이버 MYBOX 열기</button><p class="muted">MYBOX는 보안상 자동 로그인·자동 업로드하지 않습니다. 먼저 백업 파일을 다운로드한 뒤 MYBOX에 직접 업로드하세요. 전체 DB 서버 백업은 서버 연결 후 구현됩니다.</p><label>백업 복원 파일</label><input type="file" id="importData" accept=".json,application/json"></section><section class="card"><h3>화면/모듈 정의</h3><p class="muted">각 화면은 개별 모듈로 구성되어 있습니다. 운영 버전에서는 관리자 권한으로 필드 정의와 API 설정을 서버에서 관리할 수 있도록 확장합니다.</p><div class="people"><span class="person">로그인 모듈</span><span class="person">프로젝트 모듈</span><span class="person">진행상황 모듈</span><span class="person">결과정리 모듈</span><span class="person">관리자 모듈</span></div></section></div>`}
function wirePage(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.selected=b.dataset.open;state.page='concept';render()});if($('#newProject'))$('#newProject').onclick=()=>showNewProject();if($('#backProjects'))$('#backProjects').onclick=()=>{state.page='projects';render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{saveCurrent();state.page=b.dataset.tab;render()});if($('#saveProject'))$('#saveProject').onclick=()=>{saveCurrent();save();render();toast('저장했습니다.')};if($('#log_progress'))$('#log_progress').oninput=()=>$('#logProgressValue').textContent=$('#log_progress').value+'%';document.querySelectorAll('[data-viewlog]').forEach(b=>b.onclick=()=>{const d=document.querySelector('[data-logdetail="'+CSS.escape(b.dataset.viewlog)+'"]');if(d)d.classList.toggle('hidden')});if($('#progressLogs'))$('#progressLogs').onclick=e=>{const b=e.target.closest('[data-deletelog]');if(!b)return;const p=current(),id=b.dataset.deletelog;if(!confirm('이 날짜별 진행 기록을 삭제할까요? 삭제한 기록은 복구할 수 없습니다.'))return;p.logs=(p.logs||[]).filter((l,i)=>(l.id||l.date+'-'+i)!==id);save();const f=$('#log_filter')?.value||'all';$('#progressLogs').innerHTML=renderLogs(p,f);toast('진행 기록을 삭제했습니다.')};if($('#p_files'))$('#p_files').onchange=async e=>{let p=current();for(const f of e.target.files){if(f.size>2*1024*1024){alert('이미지 한 장은 2MB 이하로 선택해 주세요.');continue}const data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});p.images=p.images||[];p.images.push(data)}save();render()};document.querySelectorAll('[data-removeimg]').forEach(b=>b.onclick=()=>{current().images.splice(+b.dataset.removeimg,1);save();render()});if($('#addProgressLog'))$('#addProgressLog').onclick=async()=>{const p=current(),date=$('#log_date').value,progress=Math.max(0,Math.min(100,Number($('#log_progress').value)||0)),txt=$('#log_text').value.trim(),input=$('#log_files'),files=Array.from(input.files||[]);if(!date||(!txt&&!files.length)){alert('기록 날짜와 진행 내용 또는 첨부 파일을 입력하세요.');return}if(files.some(f=>f.size>3*1024*1024)){alert('파일 1개당 최대 3MB까지 첨부할 수 있습니다.');return}const stored=[];for(const f of files){const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});stored.push({name:f.name,type:f.type,data})}p.logs=p.logs||[];p.logs.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),date,progress,text:txt,files:stored,createdAt:new Date().toISOString()});p.progress=progress;p.update=date;p.progressText='';save();render();toast('날짜별 진행 기록과 첨부 파일을 저장했습니다.')};if($('#log_filter'))$('#log_filter').onchange=()=>{$('#progressLogs').innerHTML=renderLogs(current(),$('#log_filter').value)};if($('#myboxBackup'))$('#myboxBackup').onclick=()=>window.open('https://mybox.naver.com/','_blank','noopener');if($('#saveSecurity'))$('#saveSecurity').onclick=()=>{alert('데모 설정을 확인했습니다. 실제 보안 정책은 서버 설정으로 구현해야 합니다.')};if($('#exportData'))$('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify({projects:state.projects,users:state.users},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nae-hail-backup.json';a.click();URL.revokeObjectURL(a.href)};if($('#importData'))$('#importData').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d.projects))state.projects=d.projects;if(Array.isArray(d.users))state.users=d.users;save();render();alert('백업을 복원했습니다.')}catch(err){alert('JSON 파일을 읽을 수 없습니다.')}};r.readAsText(f)}}
function saveCurrent(){const p=current();if(!p)return;const get=id=>$('#'+id)?.value??'';p.name=get('p_name')||p.name;p.concept=get('p_concept');p.people=get('p_people');p.owner=get('p_owner');p.progressText='';p.output=get('p_output');p.achievement=get('p_achievement');p.end=get('p_end');p.outcome=get('p_outcome');p.review=get('p_review');if(p.status==='완료'&&p.progress<100)p.progress=100;if(p.outcome==='성공')p.status='완료';if(p.outcome==='실패')p.status='실패'}
function showNewProject(){const back=document.createElement('div');back.className='modalback';back.innerHTML=`<div class="modal"><h2>새 프로젝트 만들기</h2><label>프로젝트명 *</label><input id="newName" maxlength="80" placeholder="예: 신규 서비스 개발"><label>아이콘</label><select id="newIcon"><option>📁</option><option>🏙️</option><option>💼</option><option>🌐</option><option>🎯</option><option>💡</option></select><label>시작 날짜</label><input type="date" id="newStart" value="${new Date().toISOString().slice(0,10)}"><div class="row" style="margin-top:18px"><button id="createNow">프로젝트 생성</button><button class="secondary" id="cancelNew">취소</button></div><div class="muted" style="margin-top:10px">최대 20개까지 생성할 수 있습니다.</div></div>`;document.body.append(back);$('#cancelNew').onclick=()=>back.remove();$('#createNow').onclick=()=>{const name=$('#newName').value.trim();if(!name){alert('프로젝트명을 입력하세요.');return}if(state.projects.length>=20){alert('프로젝트는 최대 20개까지 가능합니다.');back.remove();return}const p={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,icon:$('#newIcon').value,start:$('#newStart').value,progress:0,status:'진행 중',images:[],logs:[],concept:'',people:'',owner:'',progressText:'',output:'',achievement:'',end:'',outcome:'',review:''};state.projects.unshift(p);state.selected=p.id;state.page='concept';save();back.remove();render()}}
function toast(s){const t=document.createElement('div');t.textContent=s;t.style='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#123c73;color:white;padding:12px 20px;border-radius:12px;z-index:50';document.body.append(t);setTimeout(()=>t.remove(),1800)}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
